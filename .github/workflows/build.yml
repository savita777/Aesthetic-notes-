name: Build Aesthetic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Android Native Code (Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Compile APK
        working-directory: android
        run: ./gradlew assembleRelease
        
      - name: Bypass GitHub Quota & Upload APK
        run: |
          echo "Uploading APK to BashUpload..."
          curl -T android/app/build/outputs/apk/release/app-release.apk https://bashupload.com/AestheticNotes.apk
          echo ""
          echo "=========================================================="
          echo "🎉 BUILD SUCCESSFUL! 🎉"
          echo "⬇️ UPAR JO BASHUPLOAD KA LINK AAYA HAI USKO COPY KARKE CHROME MEIN KHOLEIN"
          echo "=========================================================="
          
