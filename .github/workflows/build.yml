name: Build Aesthetic APK

on:
  workflow_dispatch:

# 🚀 NAYA: Release banane ke liye GitHub Actions ko permission deni padti hai
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix

      - name: Build Android Native Code (Prebuild)
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean

      - name: Compile APK
        working-directory: android
        run: ./gradlew assembleRelease

      # 🚀 NAYA: Har build ke liye ek unique Time-based Tag banayega (e.g., v1.0.20241026)
      - name: Generate Release Tag
        id: tag
        run: echo "RELEASE_TAG=v1.0.$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

      # 🚀 NAYA: GitHub Release page banakar APK wahan upload karega
      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Lumina Notes Build ${{ env.RELEASE_TAG }}
          body: "🚀 New premium build of Lumina Notes is ready to install!"
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
