name: Build Aesthetic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Android Native Code (Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Compile APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Bypass GitHub Quota & Upload APK
        run: |
          echo "Uploading APK to secure temporary server..."
          URL=$(curl -s -F "file=@android/app/build/outputs/apk/release/app-release.apk" https://file.io)
          echo "=========================================================="
          echo "🎉 BUILD SUCCESSFUL! 🎉"
          echo "⬇️ COPY THIS LINK AND PASTE IN CHROME TO DOWNLOAD:"
          echo $URL | grep -o '"link":"[^"]*' | cut -d'"' -f4
          echo "=========================================================="
          echo "⚠️ NOTE: This link is highly secure and will expire after 1 download."
          
