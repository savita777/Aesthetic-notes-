name: Build Aesthetic APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Android Native Code (Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Compile APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Save APK directly to GitHub Repo
        run: |
          echo "Bypassing Artifact Quota! Saving APK directly to repo..."
          mkdir -p Ready-APK
          cp android/app/build/outputs/apk/release/app-release.apk Ready-APK/LuminaNotes.apk
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add Ready-APK/LuminaNotes.apk
          git commit -m "🚀 Add latest APK build [skip ci]"
          git push
          
